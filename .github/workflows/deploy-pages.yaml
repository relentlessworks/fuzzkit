name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy docs content to a temp location
          cp -r docs /tmp/gh-pages-content

          # Create or switch to gh-pages branch
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Clear the working tree
          git rm -rf . 2>/dev/null || true

          # Copy docs content back
          cp -r /tmp/gh-pages-content/* .
          cp -r /tmp/gh-pages-content/.* . 2>/dev/null || true

          # Add and commit
          git add -A
          git commit -m "Deploy pages from ${{ github.sha }}" || echo "No changes to commit"

          # Force push to gh-pages
          git push origin gh-pages --force
